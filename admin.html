<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — AKSHUTO</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/akshuto-logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a href="index.html" class="logo">AKSHUTO<span>.</span> <small style="font-family: var(--font-body); font-weight: 600; color: var(--muted); font-size: 13px;">/ admin</small></a>
    <a href="index.html" class="btn btn-ghost" style="padding: 8px 16px; font-size: 13px;">Back to site</a>
  </div>
</nav>

<!-- LOGIN VIEW -->
<section id="login-view" class="wrap admin-section" style="max-width: 420px;">
  <h1 class="section-title" style="margin-bottom: 6px;">Admin login</h1>
  <p class="section-sub" style="margin-bottom: 28px;">Only you should have this password.</p>
  <form id="login-form">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Log in</button>
    <p id="login-error" class="note" style="display:none; border-left-color: #d9534f;"></p>
  </form>
</section>

<!-- DASHBOARD VIEW (hidden until logged in) -->
<section id="dashboard-view" class="wrap admin-section" style="display:none;">
  <div class="section-head">
    <div>
      <h1 class="section-title">Dashboard</h1>
      <p class="section-sub">Changes here go live on your site immediately.</p>
    </div>
    <button id="logout-btn" class="btn btn-ghost">Log out</button>
  </div>

  <!-- Profile picture -->
  <div class="admin-card">
    <h2 class="admin-card-title">Profile picture</h2>
    <div class="admin-avatar-row">
      <img id="current-avatar" class="admin-avatar-preview" src="assets/akshuto-logo.png" alt="Current profile picture">
      <div>
        <input type="file" id="avatar-file" accept="image/*">
        <p id="avatar-status" class="copy-hint"></p>
      </div>
    </div>
  </div>

  <!-- Add project -->
  <div class="admin-card">
    <h2 class="admin-card-title">Add a project</h2>
    <form id="project-form">
      <div class="field">
        <label for="p-title">Title</label>
        <input type="text" id="p-title" required>
      </div>
      <div class="field">
        <label for="p-desc">Short description</label>
        <textarea id="p-desc" required style="min-height: 70px;"></textarea>
      </div>
      <div class="field">
        <label for="p-category">Category</label>
        <select id="p-category">
          <option value="graphic">Graphic Design</option>
          <option value="video">Video Editing</option>
        </select>
      </div>
      <div class="field">
        <label><input type="checkbox" id="p-featured"> Show on home page (featured)</label>
      </div>
      <div class="field">
        <label><input type="checkbox" id="p-wide"> Display as a wide card</label>
      </div>
      <div class="field">
        <label for="p-file">Images or videos (select multiple to make this a folder/gallery)</label>
        <input type="file" id="p-file" accept="image/*,video/*" multiple required>
      </div>
      <button type="submit" class="btn btn-primary">Add project</button>
      <p id="project-status" class="copy-hint"></p>
    </form>
  </div>

  <!-- Manage existing projects -->
  <div class="admin-card">
    <h2 class="admin-card-title">Your projects</h2>
    <div id="admin-project-list" class="admin-project-list">
      <p class="note">Loading…</p>
    </div>
  </div>
</section>

<script type="module" src="admin.js"></script>
</body>
</html>
